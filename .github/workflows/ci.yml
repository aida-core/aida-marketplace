---
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Least-privilege default for the workflow. Every job here only reads the
# repo; nothing writes back. Per #20 Phase 3 hardening.
permissions:
  contents: read

jobs:
  typecheck:
    name: TypeScript
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20"

      - run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Run unit tests
        run: npm test

      - name: Validate marketplace.json (per ADR-0001)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run validate

      - name: Plugin version check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run check

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20"

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"

      - name: Install linters
        run: |
          pip install -r requirements-dev.txt
          npm install -g markdownlint-cli2

      - name: Lint YAML
        run: make lint-yaml

      - name: Lint Markdown
        run: make lint-md

      - name: Validate JSON
        run: |
          make lint-json
          echo "marketplace.json is valid JSON"

      - name: Lint REUSE / SPDX
        run: make lint-reuse

      - name: Validate markdown frontmatter
        run: make validate-frontmatter

  changelog:
    name: Changelog
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0

      - name: Verify CHANGELOG.md updated
        if: ${{ !contains(github.event.pull_request.labels.*.name, 'skip-changelog') }}
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          git fetch origin "$BASE_REF" --depth=1
          if git diff --name-only "origin/$BASE_REF...HEAD" | grep -qx CHANGELOG.md; then
            echo "CHANGELOG.md was updated."
          else
            msg="CHANGELOG.md was not updated."
            msg="$msg Add an entry under [Unreleased],"
            msg="$msg or apply the 'skip-changelog' label if this PR genuinely"
            msg="$msg doesn't warrant one (typo fixes, internal CI tweaks, etc.)."
            echo "::error::$msg"
            exit 1
          fi
